# 每周增量刷新内置的区块高度锚点表（data/btc-heights.json），有变化就提交到 main。
# 这只是替访客省几次请求：页面运行时会自己补齐表末尾到链顶的缺口并缓存，
# 工作流停掉也不影响正确性。
# 用 GITHUB_TOKEN 推送的提交不会触发 GitHub Pages 的自动构建（GitHub 的
# 防递归规则），所以提交后再显式请求一次 Pages 构建。
name: Refresh height anchors

on:
  schedule:
    - cron: '23 3 * * 1' # 每周一 03:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch new height anchors (incremental, mempool.space + blockstream.info)
        run: node scripts/fetch-heights.mjs

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/btc-heights.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No anchor changes."
            exit 0
          fi
          git commit -m "区块高度锚点表自动刷新 $(date -u +%Y/%m/%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pages 以 main 分支为源时，GITHUB_TOKEN 的推送不会自动触发部署，
      # 这里请求一次构建。若此步失败（权限不足），锚点表会在下一次人工推送时上线
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
