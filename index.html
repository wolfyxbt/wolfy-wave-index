<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>狼波周期指数 · Wolfy Wave Index</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23EC2626'/%3E%3Cstop offset='.15' stop-color='%23F69C1C'/%3E%3Cstop offset='.3' stop-color='%23D6DF38'/%3E%3Cstop offset='.5' stop-color='%2348BE50'/%3E%3Cstop offset='.75' stop-color='%233EC4E9'/%3E%3Cstop offset='1' stop-color='%23263CDB'/%3E%3C/linearGradient%3E%3Crect width='32' height='32' rx='5' fill='url(%23g)'/%3E%3C/svg%3E">
  <!-- 主屏图标：iOS「添加到主屏幕」只认 PNG 的 apple-touch-icon（不支持
       SVG，也不读 data: URI）；Android 走 manifest 里的 PNG 图标 -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Wolfy Wave">
  <meta name="theme-color" content="#0e1117">
  <link rel="stylesheet" href="css/style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EB66G8KMTF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-EB66G8KMTF');
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- 品牌标记：狼波色谱六个主色锚点的垂直渐变（1=牛顶红在上，0=熊底蓝在下），
           渐变位置 = 1 - 指数值，与右侧色标同一映射 -->
      <svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <defs>
          <linearGradient id="brand-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#EC2626"/>
            <stop offset="0.15" stop-color="#F69C1C"/>
            <stop offset="0.30" stop-color="#D6DF38"/>
            <stop offset="0.50" stop-color="#48BE50"/>
            <stop offset="0.75" stop-color="#3EC4E9"/>
            <stop offset="1" stop-color="#263CDB"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="5" fill="url(#brand-grad)"/>
      </svg>
      <div class="brand-text">
        <div class="brand-name" id="brand-name">Wolfy Wave Index</div>
        <div class="brand-sub" id="brand-sub" hidden></div>
      </div>
    </div>
    <div class="top-controls">
      <div class="seg" id="tf-group" title="Bucket size: D = 144 blocks · W = 1,008 · M = 4,368">
        <button data-tf="day" class="active">D</button>
        <button data-tf="week">W</button>
        <button data-tf="month">M</button>
      </div>
      <div class="seg" id="style-group" title="Chart type">
        <button data-style="wave" class="active">Wave</button>
        <button data-style="candles">Candles</button>
        <button data-style="line">Line</button>
      </div>
      <div class="seg" id="scale-group" title="Price scale">
        <button data-scale="log" class="active">Log</button>
        <button data-scale="linear">Linear</button>
      </div>
      <!-- 标注开关（纯图标 + 悬停提示）：竖虚线 = 减半日，双色块 = 牛熊市 -->
      <button id="halving-toggle" class="toggle-btn active" title="Show/hide halving marks">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v3.5M12 10.25v3.5M12 17.5V21"/></svg>
      </button>
      <button id="bands-toggle" class="toggle-btn active" title="Show/hide bull/bear marks">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="3.5" y="5" width="7.5" height="14" rx="1.5"/><rect x="13" y="5" width="7.5" height="14" rx="1.5" opacity="0.45"/></svg>
      </button>
    </div>
    <div class="topbar-right">
      <div class="stats">
        <div class="stat skeleton" id="stat-price-cell">
          <span class="stat-label"><span id="label-price">BTC Price</span><i class="live-dot"></i></span>
          <div class="stat-value">
            <span id="stat-price" class="price">—</span>
            <span id="stat-chg" class="chg">—</span>
          </div>
        </div>
        <div class="stat skeleton" id="stat-height-cell">
          <span class="stat-label"><span id="label-height">Block Height</span><i class="live-dot"></i></span>
          <div class="stat-value">
            <span id="stat-height" class="price">—</span>
          </div>
        </div>
        <div class="stat skeleton" id="stat-wave-cell" title="Wolfy Wave Index · 0 = bear bottom · 1 = bull top">
          <span class="stat-label"><span id="stat-wave-label">WWI</span><i class="live-dot"></i></span>
          <div class="stat-value">
            <span id="stat-wave" class="price">—</span>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <a class="icon-btn" href="https://x.com/wolfyxbt" target="_blank" rel="noopener noreferrer" title="X · @wolfyxbt">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a class="icon-btn" href="https://github.com/wolfyxbt/wolfy-wave-index" target="_blank" rel="noopener noreferrer" title="GitHub · wolfy-wave-index">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button class="icon-btn" id="about-toggle" title="Methodology">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.1a2.7 2.7 0 1 1 3.9 2.8c-.8.35-1.3.9-1.3 1.8v.3"/><path d="M12 17.1v.01"/></svg>
        </button>
        <button class="icon-btn" id="lang-toggle" title="Language">
          <span class="glyph-zh">中</span>
          <span class="glyph-en">EN</span>
        </button>
        <button class="icon-btn" id="theme-toggle" title="Dark / light theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5a8.5 8.5 0 1 0 10.9 10.9z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="chart-wrap">
    <div class="chart-host">
      <div id="chart"></div>
      <div id="now-line" class="now-line" hidden></div>
      <div id="legend" class="legend"><b>BTC/USD</b><b id="legend-price" class="legend-val"></b></div>
      <div id="phase-legend" class="legend phase-legend" hidden></div>
      <div id="tooltip" class="chart-tooltip" hidden></div>
      <button id="phase-toggle" class="phase-toggle active" title="Show/hide Wave Index pane">
        <svg class="icon-collapse" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        <svg class="icon-expand" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
      </button>
      <!-- 骨架屏：行情到齐前占住图表区（主图 : 副图 = 4 : 1），失败时在原位提示并可重试 -->
      <div id="skeleton" class="chart-skeleton" role="status" aria-busy="true" aria-label="Loading market data…">
        <div class="sk-pane sk-main"></div>
        <div class="sk-pane sk-sub"></div>
        <div class="sk-error" id="sk-error" hidden>
          <div id="sk-error-text"></div>
          <button id="sk-retry" class="sk-retry" type="button">Retry</button>
        </div>
      </div>
    </div>

    <aside class="wave-scale" id="wave-scale" title="Wave Index color scale">
      <div class="ws-label" id="ws-top">Top</div>
      <div class="ws-body">
        <div class="ws-bar" id="ws-bar">
          <div class="ws-marker" id="ws-marker" hidden></div>
        </div>
        <div class="ws-ticks">
          <span>1.00</span><span>0.75</span><span>0.50</span><span>0.25</span><span>0.00</span>
        </div>
      </div>
      <div class="ws-label" id="ws-bottom">Bottom</div>
    </aside>

    <div id="notice" class="notice" hidden>
      <span id="notice-text"></span>
      <button id="notice-close" aria-label="Close">×</button>
    </div>

  </main>

  <div id="block-axis" class="block-axis">
    <span id="bx-name" class="bx-name">Block Height</span>
    <div id="bx-now" class="bx-now" hidden></div>
    <div id="bx-cursor" class="bx-cursor" hidden></div>
  </div>

  <!-- 指标说明弹窗：内容由 i18n 按当前语言注入（aboutHtml） -->
  <div id="about-overlay" class="about-overlay" hidden>
    <div class="about-modal" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="about-head">
        <b id="about-title">Wolfy Wave Index · Methodology</b>
        <button class="icon-btn" id="about-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="about-body" id="about-body"></div>
    </div>
  </div>

  <script>
    // 必须放在模块脚本之外：file:// 下浏览器根本不会加载 ES module，
    // 模块内的检测代码是死代码
    if (location.protocol === 'file:') {
      document.getElementById('sk-error-text').textContent =
        '不能直接双击打开本页面，请在项目目录运行 python3 -m http.server 8080 后访问 http://localhost:8080 '
        + '/ This page cannot be opened via file:// — run "python3 -m http.server 8080" in the project folder, then visit http://localhost:8080';
      document.getElementById('sk-retry').hidden = true;
      document.getElementById('sk-error').hidden = false;
      document.getElementById('skeleton').classList.add('is-error');
    }
  </script>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
